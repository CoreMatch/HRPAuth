# HRPAuth 部署声明（deploy-manifest v1）
# schema 依据：HA-Services-Deployer internal/manifest/（SchemaVersion=1）
manifest_version: 1
kind: service
project: hrpauth
display_name: HRPAuth
group: core
# 生产 /status 自报 version 62526（PROD-UPGRADE-EXECUTED-20261106 §10-3），
# 仓库存在同名 git tag 62526。
service_version: "62526"

facts:
  ports:
    # deploy/config/hrpauth.yaml.tmpl: server.port :2778；compose 默认对外映射
    - name: http
      port: 2778
      exposure: public
  health:
    # main.go r.GET("/health")；compose healthcheck 同路径
    http:
      port_name: http
      path: /health
      expect_status: 200
      timeout_seconds: 5
      interval_seconds: 30
      retries: 3
  smoke:
    # 部署后冒烟：真签出一个 service token，证明 OAuth2 签发链路活着
    # （不只是进程活着）。走 client_credentials 授权模式——与
    # Yggdrasil-API 等下游服务获取 service token 的路径一致
    # （knowledge/0007）。client_id/client_secret 从 Deployer 凭据文件
    # smoke_secrets.hrpauth_smoke_client_id / _client_secret 解析，
    # 绝不写进本清单；凭据缺失时 preflight 直接阻断并报清楚。
    # 端点事实：POST /oauth/token（main.go 路由；controllers/oauth2_controller.go
    # Token 处理，client_credentials 分支返回 access_token/token_type/
    # expires_in，响应信封将字段展开到顶层）；凭据错误返回 401 invalid_client。
    - name: oauth-token-issue
      method: POST
      path: /oauth/token
      content_type: application/json
      body: '{"grant_type":"client_credentials","client_id":"${secret:hrpauth_smoke_client_id}","client_secret":"${secret:hrpauth_smoke_client_secret}"}'
      expect_status: 200
      timeout_seconds: 10
      assert:
        json_field: access_token
        json_not_empty: access_token
  depends_on:
    # database/redis 段为启动硬依赖；对 YGG 仅运行期调用（不作为启动序依赖，
    # compose 中 hrpauth 无 depends_on），且声明反向边会成环，故不登记。
    - project: mysql
      kind: required
    - project: redis
      kind: required
  migration:
    # main.go RegisterOnConnect -> EnsureMigrations（golang-migrate 启动自动迁移）；
    # 配置文件同样启动期自动迁移（v11→v14 等，config/migrations.go）。
    mode: auto_on_startup
  data_dirs:
    # hrpauth.yaml.tmpl: sdk_packages.storage_dir / verification_code.storage_dir
    - ./data/sdk_packages
    - ./cache/verification_codes
  config:
    # controllers/startup_controller.go ConfigFileName="config.yaml"；
    # 模板版本 = Deployer 模板（deploy/config/hrpauth.yaml.tmpl）首行
    # version: "15"（代码 config.ConfigVersion 同值；v14->v15 为 ygg
    # base_url 2779->2770 修正迁移，模板与代码已同步，无漂移）。
    - path: config.yaml
      template_version: "15"
  static_assets: ""

baremetal:
  process:
    # 生产现由宝塔面板管理（面板 Go 项目，重启/自启见面板与每日 00:00 cron）。
    manager: aapanel
  install:
    # PROD-FILEREFRESH-20261107 §1：二进制在位路径 /www/wwwroot/ha/HRPAuth
    root: /www/wwwroot/ha
    binary_name: HRPAuth
  artifact:
    # 本阶段统一 local_path；当前可复现产物为仓库 build/ 输出（build.sh）。
    source: local_path
    local_path: build/HRPAuth

container:
  enabled: false
